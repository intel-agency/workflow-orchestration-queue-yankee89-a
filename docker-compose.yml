services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    env_file: .env
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: Dockerfile.notifier
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
